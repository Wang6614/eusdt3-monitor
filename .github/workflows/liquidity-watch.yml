name: liquidity-watch

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"   # 每小时启动一次

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Run monitor (1s polling)
        env:
          # 必填（Secrets）
          SNOWTRACE_API_KEY: ${{ secrets.SNOWTRACE_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 可改（默认就是 eUSDt-3/USDT on AVAX）
          VAULT_ADDRESS: 0xE1A62FDcC6666847d5EA752634E45e134B2F824B
          USDT_TOKEN: 0x9702230A8Ea53601f5Cd2dc00fDBC13d4dF4A8c7
          DECIMALS: "6"
          # 监控参数
          POLL_SECONDS: "1"           # 1秒轮询
          ALERT_THRESHOLD: "1"        # ≥1 USDT 变动才告警（想更激进可设0）
          ALERT_COOLDOWN: "30"        # 告警冷却30秒
          MAX_RUNTIME_SECONDS: "3300" # 单次运行≈55分钟
        run: python monitor.py
