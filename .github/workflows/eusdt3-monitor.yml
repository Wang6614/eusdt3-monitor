name: eUSDT-3 Monitor

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Alert threshold in USDT"
        required: false
        default: "10"
  schedule:
    - cron: "0 * * * *"   # UTC 每小时整点自动重启一轮

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Run monitor (1s polling)
        env:
          # 必填（放在 Settings → Secrets → Actions）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}

          # 可改参数（一般不用动）
          RPC_URL: "https://api.avax.network/ext/bc/C/rpc"
          USDT_TOKEN: "0x9702230A8Ea53601f5Cd2dc00fDBC13d4DF4A8c7"
          DECIMALS: "6"

          # 监控参数
          POLL_SECONDS: "1"
          ALERT_THRESHOLD: ${{ github.event.inputs.threshold || '10' }}
          ALERT_COOLDOWN: "30"
          MAX_RUNTIME_SECONDS: "3300"
        run: python monitor.py
